<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local-First Agent Workbench</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"SF Pro Text","Microsoft YaHei",system-ui,sans-serif;--bg:#191919;--side:#141414;--panel:#202020;--raised:#292929;--hover:#303030;--line:#383838;--text:#ececec;--muted:#a4a4a4;--faint:#737373;--green:#6fce9b;--blue:#79aefc;--purple:#b69af5;--amber:#e6b75c;--red:#ef7c83}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{color:inherit}button:disabled{opacity:.55;cursor:not-allowed}body.busy [data-action]{pointer-events:none}.app{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;min-height:100vh}.sidebar{height:100vh;position:sticky;top:0;padding:12px 10px;background:var(--side);border-right:1px solid #282828;display:flex;flex-direction:column;overflow:hidden}.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 14px;font-weight:700}.logo{width:27px;height:27px;border-radius:8px;background:#efefef;color:#161616;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:1px}.primary{border:1px solid #444;background:#f0f0f0;color:#151515;font-weight:700;border-radius:9px;padding:9px 12px;cursor:pointer}.primary:hover{background:#fff}.new-task{width:100%;margin-bottom:9px;text-align:left}.nav{display:grid;gap:2px}.nav-btn,.recent-item{width:100%;border:0;background:transparent;border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;color:#ccc}.nav-btn:hover,.recent-item:hover,.nav-btn.active,.recent-item.active{background:var(--hover);color:#fff}.nav-icon{display:inline-block;width:23px;color:var(--muted)}.side-heading{display:flex;justify-content:space-between;align-items:center;padding:17px 10px 5px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.recent{overflow:auto;min-height:80px}.recent-item{display:block}.recent-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.recent-meta{font-size:10px;color:var(--faint);margin-top:3px}.side-footer{margin-top:auto;border-top:1px solid #2c2c2c;padding:10px}.health-line{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--green)}.main{min-width:0;padding:0 30px 80px}.topbar{height:58px;position:sticky;top:0;z-index:10;background:#191919eF;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2c2c2c}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;gap:8px}.icon-btn,.secondary,.danger-btn,.ghost{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 11px;cursor:pointer}.icon-btn:hover,.secondary:hover,.ghost:hover{background:#343434}.danger-btn{color:#ffacb0;border-color:#5b3639;background:#2c2021}.danger-btn:hover{background:#3a2527}.ghost{background:transparent;border-color:transparent}.content{max-width:980px;margin:0 auto;padding-top:26px}.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.page-title h1{font-size:25px;line-height:1.25;margin:0 0 5px;letter-spacing:-.025em}.muted{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;gap:9px;align-items:center;margin:16px 0}.search{position:relative;flex:1}.search input{padding-left:34px}.search:before{content:'⌕';position:absolute;left:12px;top:9px;color:var(--muted)}input,textarea,select{width:100%;background:#242424;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;outline:none}input:focus,textarea:focus,select:focus{border-color:#6b6b6b;box-shadow:0 0 0 2px #ffffff0c}textarea{min-height:120px;resize:vertical}label{font-size:12px;color:#c5c5c5;display:block}label>input,label>textarea,label>select{margin-top:7px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:#fff;border-bottom-color:#ddd}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}.stat,.card,.section{background:var(--panel);border:1px solid #343434;border-radius:10px}.stat{padding:16px}.stat-value{font-size:26px;font-weight:650}.stat-label{font-size:11px;color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{padding:15px;cursor:pointer}.card:hover{border-color:#555;background:#242424}.card-head{display:flex;justify-content:space-between;gap:12px}.card h3{font-size:14px;margin:0 0 5px}.badge{font-size:10px;padding:3px 7px;border:1px solid #454545;border-radius:99px;color:#bbb;white-space:nowrap}.badge.green{color:var(--green);border-color:#345b46}.badge.purple{color:var(--purple);border-color:#53456e}.badge.amber{color:var(--amber);border-color:#63522f}.badge.red{color:var(--red);border-color:#66383b}.card-meta{display:flex;gap:13px;color:var(--faint);font-size:11px;margin-top:13px}.list{border:1px solid #343434;border-radius:10px;overflow:hidden}.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:13px 15px;background:var(--panel);border-bottom:1px solid #313131;cursor:pointer}.list-row:last-child{border-bottom:0}.list-row:hover{background:#262626}.row-title{font-weight:600;font-size:13px}.row-sub{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-right{text-align:right}.empty{padding:55px 20px;text-align:center;border:1px dashed #3d3d3d;border-radius:11px;color:var(--muted)}.empty strong{display:block;color:#ddd;font-size:16px;margin-bottom:7px}.section{padding:18px;margin-bottom:13px}.section h2{font-size:14px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}.allocation{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center}.allocation-score{font-size:30px;font-weight:700}.bar{height:9px;background:#44345f;border-radius:99px;overflow:hidden;display:flex}.bar-local{height:100%;background:var(--green)}.bar-codex{height:100%;background:var(--purple)}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}.reason{font-size:12px;color:#c2c2c2;line-height:1.55;margin-top:11px}.source{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px;border:1px solid #383838;border-radius:8px;margin:7px 0;background:#242424}.source input{width:auto;margin-top:3px}.source a{font-size:11px;color:var(--blue)}.source p{font-size:11px;color:var(--muted);margin:5px 0 0}.stages{display:grid;gap:8px}.stage{display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:11px;padding:12px;border:1px solid #373737;border-radius:9px;background:#222}.stage.current{border-color:#676767;background:#272727}.stage.completed .stage-num{background:#315541;color:var(--green)}.stage.failed{border-color:#623b3e}.stage-num{width:25px;height:25px;border-radius:7px;background:#333;display:grid;place-items:center;font-size:11px}.stage h3{font-size:13px;margin:1px 0 4px}.stage p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}.stage-result{margin-top:8px;font-size:11px;white-space:pre-wrap;max-height:100px;overflow:auto;color:#bbb}.stage-actions{display:flex;gap:8px;margin-top:12px}.stage-actions input{margin:0}.timeline{max-height:520px;overflow:auto;padding-right:4px}.message{display:grid;grid-template-columns:28px 1fr;gap:9px;margin:13px 0}.avatar{width:27px;height:27px;border-radius:7px;background:#353535;display:grid;place-items:center;font-size:10px;font-weight:700}.message.user .avatar{background:#403759}.bubble{font-size:12px;line-height:1.6;white-space:pre-wrap}.message-head{font-size:10px;color:var(--faint);margin-bottom:3px}.composer{display:flex;gap:8px;margin-top:14px}.composer textarea{min-height:52px}.inspector{height:100vh;position:sticky;top:0;background:#171717;border-left:1px solid #2a2a2a;padding:15px;overflow:auto}.inspector h2{font-size:13px;margin:5px 0 15px}.inspector-close,.mobile-inspector-btn{display:none}.property{padding:10px 0;border-bottom:1px solid #2e2e2e}.property-name{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}.property-value{font-size:12px;margin-top:5px;line-height:1.45;word-break:break-word}.inspector-actions{display:grid;gap:7px;margin-top:16px}.inspector-actions button{width:100%;text-align:left}.service{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #303030}.service-name{display:flex;align-items:center;gap:9px}.working{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;background:#efefef;color:#171717;border-radius:99px;padding:9px 15px;font-size:12px;box-shadow:0 9px 30px #0008}.toast{position:fixed;right:24px;bottom:24px;z-index:70;background:#eeeeee;color:#181818;border-radius:9px;padding:11px 14px;font-size:12px;max-width:360px;box-shadow:0 12px 35px #0008}.toast.error{background:#512c2e;color:#ffdadd}dialog{border:1px solid #484848;border-radius:12px;background:#232323;color:var(--text);padding:0;width:min(470px,calc(100vw - 28px));box-shadow:0 30px 90px #000a}dialog::backdrop{background:#0009;backdrop-filter:blur(2px)}.modal-head{padding:17px 19px;border-bottom:1px solid #393939}.modal-head h2{font-size:15px;margin:0}.modal-body{padding:18px 19px}.modal-body p{font-size:12px;color:var(--muted);line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:13px 19px;border-top:1px solid #393939}.checkline{display:flex;gap:8px;align-items:flex-start;margin:10px 0;color:#ccc}.checkline input{width:auto;margin-top:2px}.hidden{display:none!important}.link{color:var(--blue);text-decoration:none}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px}.status-banner{padding:10px 12px;border:1px solid #564b2e;background:#29251b;color:#e8c978;border-radius:8px;font-size:11px;margin-bottom:13px}
    @media(max-width:1120px){.app{grid-template-columns:230px minmax(0,1fr)}.inspector{position:static;height:auto;grid-column:2;padding:20px 30px;border-left:0;border-top:1px solid #333}.main{padding-bottom:20px}}
    @media(max-width:760px){.app{display:block}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid #303030}.nav{grid-template-columns:repeat(4,1fr)}.nav-btn{text-align:center;font-size:11px}.nav-icon{display:block;width:auto}.recent,.side-heading{display:none}.side-footer{display:none}.main{padding:0 14px 40px}.content{padding-top:18px}.topbar{height:50px}.mobile-inspector-btn{display:inline-block}.inspector{display:none}.inspector.mobile-open{display:block;position:fixed;inset:0;z-index:80;height:100vh;padding:20px;background:#171717;border:0}.inspector-close{display:block;float:right;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 10px}.stats,.grid,.form-grid{grid-template-columns:1fr 1fr}.allocation{grid-template-columns:1fr}.page-title{display:block}.page-title button{margin-top:12px}.toolbar{flex-wrap:wrap}.toolbar .secondary{flex:1}.stage{grid-template-columns:27px minmax(0,1fr)}.stage>.badge{grid-column:2}.composer{display:block}.composer button{width:100%;margin-top:8px}}
    @media(max-width:480px){.stats,.grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.nav{grid-template-columns:repeat(4,1fr)}.brand small{display:none}}
    .card-head{align-items:flex-start}.card-head>div{min-width:0}.badge{align-self:flex-start}.secondary.active{background:#e9e9e9;color:#171717;border-color:#e9e9e9}.memory-content{white-space:pre-wrap;line-height:1.55;font-size:12px;margin-top:10px}.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions button{padding:6px 9px;font-size:11px}.chat-progress{margin:10px 0 0;padding:10px 12px;border:1px solid #4c4164;background:#262133;border-radius:8px}.chat-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--purple)}.chat-partial{white-space:pre-wrap;margin-top:8px;color:#d7d0e7;font-size:12px;line-height:1.6;max-height:260px;overflow:auto}.composer-controls{width:220px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:7px}.composer-controls .checkline{margin:0;font-size:11px}.chat-context-warning{margin:10px 0 0}.chat-context-warning strong{display:block;margin-bottom:3px;color:#f2d486}
    @media(max-width:760px){.nav{grid-template-columns:repeat(6,1fr)}.composer-controls{width:100%;margin-top:8px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">A</div><div>Local-First Agent Workbench<small>My private agent</small></div></div>
    <button class="primary new-task" data-action="new-session">＋ New task</button>
    <nav class="nav" id="nav"></nav>
    <div class="side-heading"><span>Recent tasks</span><span id="recent-count"></span></div>
    <div class="recent" id="recent"></div>
    <div class="side-footer"><div class="health-line"><i class="dot" id="overall-dot"></i><span id="overall-health">Checking the workstation</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb" id="crumb">Workbench / Overview</div><div class="top-actions"><button class="icon-btn mobile-inspector-btn" data-action="toggle-inspector" title="Properties and management">Properties</button><button class="icon-btn" data-action="refresh" title="Refresh">↻</button></div></header>
    <div class="content" id="content"></div>
  </main>
  <aside class="inspector" id="inspector"></aside>
</div>
<dialog id="modal"></dialog><div id="working" class="working hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEMORY_PAGE_SIZE=100;
const state={view:'overview',sessions:[],projects:[],workspaces:[],plans:[],memories:[],memoryResults:null,memoryQuery:'',memoryProject:'global',memoryKind:'all',memorySearchSeq:0,memoryOffset:0,memoryHasMore:false,currentMemory:null,overview:null,currentSession:null,currentProject:null,currentWorkspace:null,projectDetail:null,workspaceInspection:null,taskFilter:'active',knowledgeFilter:'active',query:'',refreshing:false,requestInFlight:false,lastSyncErrors:[],chatRun:null,chatStream:null,chatReconnectTimer:null,chatReconnectAttempt:0,chatLastEventId:0,chatReplayFloor:0,chatSeenEvents:new Set(),chatPartial:'',chatCharacterCount:0,chatPendingKey:null,chatConnectionLabel:'',chatSuppressMemory:false,chatContextTelemetry:null};
const phaseName={analysis:'Project analysis',knowledge:'Knowledge building',implementation:'Implementation',completed:'Completed',failed:'Needs attention'};const statusName={analyzing:'Analyzing',awaiting_knowledge_approval:'Awaiting knowledge approval',knowledge_building:'Building knowledge',waiting_for_stage:'Ready for the next stage',local_running:'Local model running',codex_running:'Codex running',completed:'Completed',failed:'Failed'};
async function api(path,options={}){const r=await fetch('/api/v1'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(r.status===204)return null;const text=await r.text();let d;try{d=text?JSON.parse(text):{}}catch{d={detail:text}}if(!r.ok){const x=d.detail;throw new Error(Array.isArray(x)?x.map(v=>v.msg).join('; '):x?.message||x||`HTTP ${r.status}`)}return d}
function busy(text){state.requestInFlight=true;document.body.classList.add('busy');$('working').textContent=text;$('working').classList.remove('hidden')}function idle(){state.requestInFlight=false;document.body.classList.remove('busy');$('working').classList.add('hidden')}function toast(text,error=false){const t=$('toast');t.textContent=text;t.className='toast'+(error?' error':'');setTimeout(()=>t.classList.add('hidden'),3500)}
function statusBadge(s){let c=s==='completed'?'green':s==='failed'?'red':s?.includes('running')?'purple':s==='awaiting_knowledge_approval'?'amber':'';return `<span class="badge ${c}">${esc(statusName[s]||s)}</span>`}
function dateText(v){return v?new Date(v).toLocaleString():'—'}function linkedSessions(id){return state.sessions.filter(x=>x.project_id===id)}
function editing(){const a=document.activeElement;return $('modal')?.open||state.view==='new'||!!a?.matches?.('input,textarea,select,[contenteditable="true"]')}
function memoryListPath(){const params=new URLSearchParams({limit:String(MEMORY_PAGE_SIZE+1),offset:String(state.memoryOffset)});if(state.memoryProject==='global')params.set('scope','global');else{params.set('scope','project');params.set('project_id',state.memoryProject)}if(state.memoryKind!=='all')params.set('kind',state.memoryKind);return'/memories?'+params.toString()}
async function refresh({quiet=false,preserveEditor=false}={}){if(state.refreshing)return false;state.refreshing=true;if(!quiet)busy('Synchronizing the workflow...');try{const names=['Tasks','Knowledge','Workspaces','System status','Legacy plans','Long-term memory'];const results=await Promise.allSettled([api('/agent/sessions/summaries?include_archived=true'),api('/knowledge/projects?include_archived=true'),api('/workspaces'),api('/system/overview'),api('/orchestrator/plans'),api(memoryListPath())]);const [sr,pr,wr,or,lr,mr]=results;if(sr.status==='fulfilled')state.sessions=sr.value.items;if(pr.status==='fulfilled')state.projects=pr.value;if(wr.status==='fulfilled')state.workspaces=wr.value.items;if(or.status==='fulfilled')state.overview=or.value;if(lr.status==='fulfilled')state.plans=lr.value.items;if(mr.status==='fulfilled'&&!state.memoryQuery){state.memoryHasMore=mr.value.items.length>MEMORY_PAGE_SIZE;state.memories=mr.value.items.slice(0,MEMORY_PAGE_SIZE)}state.lastSyncErrors=results.map((x,i)=>x.status==='rejected'?names[i]:null).filter(Boolean);if(state.currentProject)state.currentProject=state.projects.find(x=>x.id===state.currentProject.id)||null;if(preserveEditor&&(editing()||state.view==='session'))renderSidebar();else render();if(state.lastSyncErrors.length&&!quiet)toast('Some data could not be synchronized: '+state.lastSyncErrors.join(', '),true);return state.lastSyncErrors.length===0}catch(e){if(!quiet)toast(e.message,true);return false}finally{state.refreshing=false;if(!quiet)idle()}}
function navHtml(){const items=[['overview','⌂','Overview'],['tasks','◫','Tasks'],['knowledge','◇','Knowledge'],['memories','◆','Memory'],['workspaces','▣','Workspaces'],['system','⚙','System']];return items.map(([v,i,n])=>`<button class="nav-btn ${state.view===v?'active':''}" data-action="nav" data-view="${v}"><span class="nav-icon">${i}</span>${n}</button>`).join('')}
function renderSidebar(){$('nav').innerHTML=navHtml();const recent=state.sessions.filter(x=>!x.archived_at).slice(0,8);$('recent-count').textContent=recent.length;$('recent').innerHTML=recent.map(x=>`<button class="recent-item ${state.currentSession?.id===x.id?'active':''}" data-action="open-session" data-id="${x.id}"><span class="recent-title">${esc(x.title)}</span><span class="recent-meta">${esc(statusName[x.status]||x.status)} · Local ${x.local_percent}%</span></button>`).join('')||'<div class="muted small" style="padding:8px 10px">No tasks yet</div>';const svc=state.overview?.services||{};const ok=!state.lastSyncErrors.length&&['api','ollama','knowledge','search'].every(k=>svc[k]?.healthy);$('overall-dot').classList.toggle('ok',ok);$('overall-health').textContent=state.lastSyncErrors.length?'Synchronization issue: '+state.lastSyncErrors.join(', '):ok?'Workstation healthy':'Some services need attention'}
function render(){renderSidebar();$('crumb').textContent='Workbench / '+({overview:'Overview',tasks:'Tasks',new:'New task',session:'Task details',knowledge:'Knowledge',memories:'Long-term memory',workspaces:'Workspaces',system:'System'}[state.view]||'');const views={overview:renderOverview,tasks:renderTasks,new:renderNewSession,session:renderSession,knowledge:renderKnowledge,memories:renderMemories,workspaces:renderWorkspaces,system:renderSystem};$('content').innerHTML=(views[state.view]||renderOverview)();const inspector=$('inspector');inspector.classList.remove('mobile-open');inspector.innerHTML='<button class="inspector-close" data-action="toggle-inspector">× Close</button>'+renderInspector();bindDynamic();}
function renderOverview(){const c=state.overview?.counts||{};const active=state.sessions.filter(x=>!x.archived_at);return `<div class="page-title"><div><h1>Workflow overview</h1><div class="muted small">Move continuously from problem analysis and knowledge building to staged delivery in one interface.</div></div><button class="primary" data-action="new-session">＋ New task</button></div><div class="stats"><div class="stat"><div class="stat-value">${c.sessions??active.length}</div><div class="stat-label">Active tasks</div></div><div class="stat"><div class="stat-value">${state.projects.filter(x=>!x.archived).length}</div><div class="stat-label">Knowledge projects</div></div><div class="stat"><div class="stat-value">${c.workspaces??state.workspaces.length}</div><div class="stat-label">Read-only workspaces</div></div><div class="stat"><div class="stat-value">${c.pending_codex??0}</div><div class="stat-label">Codex queue</div></div></div><div class="section"><h2>Continue recent work</h2>${active.length?`<div class="grid">${active.slice(0,6).map(sessionCard).join('')}</div>`:`<div class="empty"><strong>No tasks yet</strong>Create your first task and the agent will assign responsibilities to the local model and Codex.</div>`}</div><div class="section"><h2>Workstation status</h2>${serviceRows()}</div>`}
function sessionCard(x){const done=x.completed_stages??x.stages?.filter(s=>s.status==='completed').length??0,total=x.stage_count??x.stages?.length??0;return `<article class="card" data-action="open-session" data-id="${x.id}"><div class="card-head"><div><h3>${esc(x.title)}</h3><div class="muted small">${esc(x.goal).slice(0,95)}</div></div>${statusBadge(x.status)}</div><div class="card-meta"><span>Local ${x.local_percent}%</span><span>${done}/${total} stages</span><span>${dateText(x.updated_at)}</span></div></article>`}
function renderTasks(){let rows=state.sessions.filter(x=>state.taskFilter==='archived'?x.archived_at:state.taskFilter==='all'?true:!x.archived_at);if(state.query)rows=rows.filter(x=>(x.title+' '+x.goal).toLowerCase().includes(state.query.toLowerCase()));return `<div class="page-title"><div><h1>Tasks</h1><div class="muted small">Manage the analysis, knowledge, stages, and delivery history for each project session.</div></div><button class="primary" data-action="new-session">＋ New task</button></div><div class="toolbar"><div class="search"><input data-role="task-search" value="${esc(state.query)}" placeholder="Search tasks"></div><button class="secondary ${state.taskFilter==='active'?'active':''}" data-action="task-filter" data-filter="active">Active</button><button class="secondary ${state.taskFilter==='archived'?'active':''}" data-action="task-filter" data-filter="archived">Archived</button><button class="secondary ${state.taskFilter==='all'?'active':''}" data-action="task-filter" data-filter="all">All</button></div>${rows.length?`<div class="list">${rows.map(x=>`<div class="list-row" data-action="open-session" data-id="${x.id}"><div><div class="row-title">${esc(x.title)} ${x.archived_at?'<span class="badge">Archived</span>':''}</div><div class="row-sub">${esc(x.goal)}</div></div><div class="row-right">${statusBadge(x.status)}<div class="row-sub">${dateText(x.updated_at)}</div></div></div>`).join('')}</div>`:`<div class="empty"><strong>No matching tasks</strong>Change the filters or create a new task.</div>`}`}
function renderNewSession(){const activeProjects=state.projects.filter(x=>!x.archived);return `<div class="page-title"><div><h1>New task</h1><div class="muted small">The project-level execution split is decided once, then the task follows a fixed workflow.</div></div></div><form id="new-session-form" class="section"><div class="form-grid"><label>Task name<input name="title" required maxlength="120" placeholder="For example: Nutrition literature review"></label><label>Project knowledge<select name="project"><option value="__auto__">Create and link a knowledge project automatically</option>${activeProjects.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.chunks||0} chunks</option>`).join('')}</select></label><label class="wide">Problem / project goal<textarea name="goal" required maxlength="20000" placeholder="Describe the expected output, constraints, available materials, and acceptance criteria."></textarea></label><label>File workspace (optional)<select name="workspace"><option value="">No workspace</option>${state.workspaces.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="checkline wide"><input name="codex_context_consent" type="checkbox"><span><b>Allow Codex stages to read this project's local knowledge and read-only workspace</b><br><span class="muted small">This applies only when the project is assigned to Codex. Otherwise, only the task goal is sent and local source text is not shared.</span></span></label></div><div style="margin-top:16px"><button class="primary" type="submit">Start project analysis</button> <button class="ghost" type="button" data-action="nav" data-view="overview">Cancel</button></div></form>`}
function renderSession(){const s=state.currentSession;if(!s)return `<div class="empty"><strong>Task not found</strong>It may have been deleted.</div>`;const knowledgeReady=['available','ready'].includes(s.knowledge_state);const knowledge=knowledgeReady?`<div class="service"><div class="service-name"><i class="dot ok"></i><div><b>${s.knowledge_state==='ready'?'Built and indexed':'Relevant local knowledge found'}</b><div class="muted small">${s.knowledge_matches?.length||0} local sources ${s.research_note?'· Written back to Obsidian':''}</div></div></div></div>`:`<div class="status-banner">Local knowledge is insufficient. Web research starts only after you approve the suggested sources.</div>${(s.source_proposals||[]).map(x=>`<label class="source"><input type="checkbox" class="source-check" value="${x.id}" ${x.selected?'checked':''}><span><b>${esc(x.name)}</b><br><a href="${esc(x.url)}" target="_blank">${esc(x.url)}</a><p>${esc(x.reason)}</p></span></label>`).join('')}<button class="primary" data-action="approve-knowledge">Approve sources and build knowledge</button>`;return `<div class="page-title"><div><h1>${esc(s.title)}</h1><div class="muted small">${esc(s.goal)}</div></div>${statusBadge(s.status)}</div>${s.archived_at?'<div class="status-banner">This task is archived. Restore it to continue managing and advancing it.</div>':''}<section class="section"><h2>Execution split</h2><div class="allocation"><div class="allocation-score">${s.local_percent}%<div class="muted small">${s.execution_mode==='local'?'Fully local':'Local + Codex'}</div></div><div><div class="bar"><i class="bar-local" style="width:${s.local_percent}%"></i><i class="bar-codex" style="width:${s.codex_percent}%"></i></div><div class="legend"><span>Local ${s.local_percent}%</span><span>Codex ${s.codex_percent}%</span></div><div class="reason">${esc(s.routing_reason)}</div></div></div></section><section class="section"><h2>Knowledge</h2>${knowledge}</section><section class="section"><h2>Implementation stages</h2><div class="stages">${s.stages.map((x,i)=>stageHtml(x,i,s)).join('')}</div>${stageAction(s)}</section><section class="section"><h2>Project conversation</h2><div class="timeline">${(s.messages||[]).map(messageHtml).join('')}</div><div id="chat-context-warning">${chatContextWarningHtml(s)}</div>${chatRunHtml(s)}<div class="composer"><textarea id="chat-input" placeholder="Add information or ask for progress; this will not change the assigned execution mode" ${chatBusy(s)?'disabled':''}></textarea><div class="composer-controls"><label class="checkline"><input id="chat-suppress-memory" type="checkbox" ${state.chatSuppressMemory?'checked':''} ${chatBusy(s)?'disabled':''}><span><b>Do not update long-term memory from this message</b><br><span class="muted">The project conversation will still be retained</span></span></label><button class="primary" data-action="send-chat" ${chatBusy(s)?'disabled':''}>Send</button></div></div></section>`}
function stageHtml(x,i,s){return `<div class="stage ${x.status} ${i===s.current_stage_index?'current':''}"><span class="stage-num">${i+1}</span><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${x.result?`<div class="stage-result">${esc(x.result)}</div>`:''}</div><span class="badge ${x.owner==='codex'?'purple':'green'}">${x.owner==='codex'?'Codex':'Local'}</span></div>`}
function stageAction(s){if(s.archived_at)return '';if(s.status==='waiting_for_stage'&&s.current_stage_index<s.stages.length)return `<div class="stage-actions"><input id="stage-note" placeholder="Optional: add requirements for the current stage"><button class="primary" data-action="advance-stage">Start stage ${s.current_stage_index+1}</button></div>`;if(s.status==='codex_running')return '<div class="status-banner" style="margin-top:12px">The Codex worker is running. Results will return to this page automatically.</div>';if(s.status==='local_running')return '<div class="status-banner" style="margin-top:12px">The local model is running. Please wait.</div>';return ''}
function messageHtml(m){return `<div class="message ${m.role}"><div class="avatar">${m.role==='user'?'Me':'AI'}</div><div class="bubble"><div class="message-head">${m.role==='user'?'You':'Private agent'} · ${phaseName[m.phase]||m.phase} · ${dateText(m.created_at)}</div>${esc(m.content)}</div></div>`}
function chatContextTelemetry(s){return state.chatRun?.session_id===s.id?state.chatContextTelemetry:s.context_telemetry}
function chatContextWarningHtml(s){const telemetry=chatContextTelemetry(s);if(!telemetry?.current_message_truncated)return'';const tokens=Number(telemetry.current_message_tokens||0),detail=tokens?`The model received about ${tokens} estimated tokens.`:'';return `<div class="status-banner chat-context-warning"><strong>Long input truncated by the context policy</strong>Only the beginning and end of this message were sent to the local model; the original message remains intact in the project conversation.${detail}</div>`}
function activeChatRunId(s){const operation=String(s?.active_operation||'');return operation.startsWith('chat-run:')?operation.slice(9):null}
function chatBusy(s){const run=state.chatRun?.session_id===s.id?state.chatRun:null;return ['queued','running'].includes(run?.status)||!!activeChatRunId(s)}
function chatRunHtml(s){const operationId=activeChatRunId(s),run=state.chatRun?.session_id===s.id?state.chatRun:null,runId=run?.id||operationId;if(!runId)return '';const status=run?.status||'queued',labels={queued:'Waiting for background execution',running:'Local model streaming',completed:'Response complete',failed:'Response failed',cancelled:'Response cancelled'},active=['queued','running'].includes(status);return `<div class="chat-progress" data-run-id="${esc(runId)}"><div class="chat-progress-head"><span id="chat-run-status">${esc(state.chatConnectionLabel||labels[status]||status)}</span><span id="chat-character-count">Received ${state.chatCharacterCount} characters</span>${active?`<button class="danger-btn" data-action="cancel-chat" data-id="${esc(runId)}">Cancel</button>`:''}</div><div class="chat-partial" id="chat-partial">${esc(state.chatPartial||run?.partial_text||run?.final_text||'Waiting for model output…')}</div></div>`}
function renderKnowledge(){let rows=state.projects.filter(x=>state.knowledgeFilter==='archived'?x.archived:state.knowledgeFilter==='all'?true:!x.archived);if(state.query)rows=rows.filter(x=>(x.name+' '+x.id).toLowerCase().includes(state.query.toLowerCase()));return `<div class="page-title"><div><h1>Knowledge</h1><div class="muted small">Manage Workbench RAG generated from Obsidian here. Knowledge uploaded manually to Open WebUI uses a separate index.</div></div><button class="primary" data-action="create-knowledge">＋ New knowledge project</button></div><div class="status-banner">Obsidian is the long-term source of truth. Workbench detects additions, changes, and deletions automatically. A separate acceptance script monitors Open WebUI's fixed chat knowledge sets, which are not deleted here.</div><div class="toolbar"><div class="search"><input data-role="knowledge-search" value="${esc(state.query)}" placeholder="Search knowledge"></div><button class="secondary ${state.knowledgeFilter==='active'?'active':''}" data-action="knowledge-filter" data-filter="active">Active</button><button class="secondary ${state.knowledgeFilter==='archived'?'active':''}" data-action="knowledge-filter" data-filter="archived">Archived</button><button class="secondary ${state.knowledgeFilter==='all'?'active':''}" data-action="knowledge-filter" data-filter="all">All</button></div>${rows.length?`<div class="grid">${rows.map(projectCard).join('')}</div>`:`<div class="empty"><strong>No matching knowledge projects</strong>Create one or change the filter to view archived projects.</div>`}`}
const memoryKindName={preference:'Preference',constraint:'Constraint',fact:'Fact',decision:'Decision',experience:'Experience',episode:'Conversation summary'};
function renderMemories(){const base=state.memoryResults??state.memories;let rows=base.filter(x=>state.memoryProject==='global'?x.scope==='global':x.scope==='project'&&x.project_id===state.memoryProject);if(state.memoryKind!=='all')rows=rows.filter(x=>x.kind===state.memoryKind);const projects=state.projects;return `<div class="page-title"><div><h1>Long-term memory</h1><div class="muted small">Retain preferences, constraints, facts, decisions, experience, and summaries across conversations. Project memories never leak into other projects.</div></div><button class="primary" data-action="create-memory">＋ New memory</button></div><div class="toolbar"><div class="search"><input data-role="memory-search" value="${esc(state.memoryQuery)}" placeholder="Search long-term memory"></div><select data-role="memory-project" style="max-width:210px"><option value="global" ${state.memoryProject==='global'?'selected':''}>Global memory</option>${projects.map(x=>`<option value="${esc(x.id)}" ${state.memoryProject===x.id?'selected':''}>Project · ${esc(x.name)}${x.archived?' (Archived)':''}</option>`).join('')}</select><select data-role="memory-kind" style="max-width:150px"><option value="all">All types</option>${Object.entries(memoryKindName).map(([value,label])=>`<option value="${value}" ${state.memoryKind===value?'selected':''}>${label}</option>`).join('')}</select></div>${state.memoryQuery?`<div class="muted small" style="margin:-8px 0 14px">Semantic-term and English/CJK bigram search · ${rows.length} on this page</div>`:''}${rows.length?`<div class="grid">${rows.map(memoryCard).join('')}</div>`:`<div class="empty"><strong>No matching memories</strong>Create a memory or change the project, type, or search filters.</div>`}${memoryPager(rows.length)}`}
function memoryPager(rowCount){if(!state.memoryOffset&&!state.memoryHasMore)return'';const page=Math.floor(state.memoryOffset/MEMORY_PAGE_SIZE)+1;return `<div class="toolbar" style="justify-content:flex-end;margin-top:16px"><span class="muted small">Page ${page} · ${rowCount} on this page${state.memoryHasMore?' · More available':''}</span><button class="secondary" data-action="memory-prev" ${state.memoryOffset?'':'disabled'}>Previous</button><button class="secondary" data-action="memory-next" ${state.memoryHasMore?'':'disabled'}>Next</button></div>`}
function memoryCard(x){const project=x.scope==='global'?'Global':state.projects.find(p=>p.id===x.project_id)?.name||x.project_id;return `<article class="card"><div class="card-head"><div><span class="badge ${x.scope==='global'?'green':'purple'}">${esc(project)}</span> <span class="badge">${esc(memoryKindName[x.kind]||x.kind)}</span></div><span class="badge ${x.confidence>=.8?'green':x.confidence>=.5?'amber':'red'}">${Math.round((x.confidence||0)*100)}%</span></div><div class="memory-content">${esc(x.content)}</div><div class="card-meta"><span>${esc(x.source)}</span><span>${dateText(x.updated_at)}</span>${x._score!==undefined?`<span>Match ${Math.round(x._score*100)}%</span>`:''}</div><div class="card-actions"><button class="secondary" data-action="edit-memory" data-id="${x.id}">Edit</button><button class="danger-btn" data-action="delete-memory" data-id="${x.id}">Delete</button></div></article>`}
function projectIndex(x){const h=state.overview?.services?.knowledge?.index?.projects?.find(p=>p.id===x.id),bg=state.overview?.services?.knowledge?.background_index||{},running=[...(bg.running_projects||[]),...(bg.queued_projects||[])].includes(x.id);if(x.archived)return{label:'Archived',cls:''};if(running)return{label:'Indexing',cls:'purple'};if(h?.stale||x.index_stats?.last_error||x.index_stats?.failed_files)return{label:'Needs repair',cls:'red'};if(!x.indexed_at)return{label:'Awaiting index',cls:'amber'};return{label:'Index healthy',cls:'green'}}
function projectCard(x){const linked=linkedSessions(x.id).length,s=projectIndex(x),stats=x.index_stats||{};return `<article class="card" data-action="open-project" data-id="${x.id}"><div class="card-head"><div><h3>${esc(x.name)}</h3><div class="mono muted">${esc(x.id)}</div></div><span class="badge ${s.cls}">${s.label}</span></div><div class="card-meta"><span>${x.chunks||0} chunks</span><span>${stats.indexed_files??'—'} files</span><span>${linked} tasks</span>${stats.truncated_files?.length?`<span>${stats.truncated_files.length} truncated</span>`:''}</div></article>`}
function renderWorkspaces(){return `<div class="page-title"><div><h1>Workspaces</h1><div class="muted small">Workspaces are registered by <code>.ai-workspace.json</code> manifests on disk. The console is read-only and never deletes files directly.</div></div></div>${state.workspaceInspection?inspectionHtml(state.workspaceInspection):''}${state.workspaces.length?`<div class="grid">${state.workspaces.map(x=>`<article class="card" data-action="open-workspace" data-id="${x.id}"><div class="card-head"><div><h3>${esc(x.name)}</h3><div class="mono muted">${esc(x.id)}</div></div><span class="badge green">Read-only</span></div><div class="muted small" style="margin-top:10px">${esc(x.description||'No description')}</div><div class="card-meta"><span>${x.capabilities.join(' · ')}</span></div></article>`).join('')}</div>`:'<div class="empty"><strong>No registered workspaces</strong>Add a valid <code>.ai-workspace.json</code> to a workspace root.</div>'}`}
function inspectionHtml(x){return `<section class="section"><h2>${esc(x.workspace.name)} · Inspection results</h2><div class="stats"><div class="stat"><div class="stat-value">${x.file_count}</div><div class="stat-label">Files</div></div><div class="stat"><div class="stat-value">${x.directory_count}</div><div class="stat-label">Directories</div></div><div class="stat"><div class="stat-value">${Math.round(x.total_bytes/1024/1024*10)/10}</div><div class="stat-label">MB</div></div><div class="stat"><div class="stat-value">${x.extensions.length}</div><div class="stat-label">File types</div></div></div></section>`}
function entrypoint(name,fallback){return state.overview?.entrypoints?.[name]||fallback}function renderSystem(){const agentFallback='/console',webFallback='http://127.0.0.1:3000/';return `<div class="page-title"><div><h1>System</h1><div class="muted small">View local models, knowledge, search, and remote entrypoints in one place.</div></div><button class="secondary" data-action="refresh">Check again</button></div><section class="section"><h2>Running services</h2>${serviceRows()}</section><section class="section"><h2>Entrypoints</h2><div class="service"><div><b>Private agent</b><div class="muted small">Project workflow management</div></div><a class="link" href="${esc(entrypoint('agent',agentFallback))}">Open</a></div><div class="service"><div><b>Open WebUI</b><div class="muted small">General chat and manual RAG</div></div><a class="link" href="${esc(entrypoint('open_webui',webFallback))}" target="_blank">Open</a></div></section><section class="section"><h2>Security boundaries</h2><div class="muted small" style="line-height:1.8">The API and knowledge service do not expose an arbitrary shell. Workspaces remain read-only. Codex runs through a separate worker and sandbox. Deleting a knowledge project requires its name, and external source folders are never deleted.</div></section>`}
function serviceRows(){const s=state.overview?.services||{},degraded=s.knowledge?.index?.stale_projects||0;return [['api','FastAPI gateway'],['ollama','Ollama / '+(s.ollama?.model||'Local model')],['knowledge','Obsidian / RAG'],['search','SearXNG web search']].map(([k,n])=>{const label=k==='knowledge'&&degraded?`${degraded} projects need index repair`:s[k]?.healthy?'Healthy':'Unavailable';return `<div class="service"><div class="service-name"><i class="dot ${s[k]?.healthy?'ok':''}"></i><span>${esc(n)}</span></div><span class="badge ${s[k]?.healthy?'green':'red'}">${label}</span></div>`}).join('')}
function renderInspector(){if(state.view==='session'&&state.currentSession){const s=state.currentSession;const p=state.projects.find(x=>x.id===s.project_id);const w=state.workspaces.find(x=>x.id===s.workspace_id);const c=s.context_telemetry||{};return `<h2>Task properties</h2>${prop('Status',statusName[s.status]||s.status)}${prop('Stage',`${Math.min(s.current_stage_index+1,s.stages.length)} / ${s.stages.length}`)}${prop('Knowledge',p?.name||'Not linked')}${prop('Workspace',w?.name||'Not bound')}${prop('Codex local context',s.codex_context_consent?'Explicitly authorized':'Not authorized')}${prop('Local context budget',`${c.estimated_input_tokens||0} / ${c.budget_tokens||10000} tokens`)}${prop('Long-term memory context',`${c.memory_tokens||0} tokens`)}${prop('Automatic compaction',`${s.compaction_count||0} times · ${s.compacted_message_count||0} messages summarized`)}${prop('Created',dateText(s.created_at))}${prop('Updated',dateText(s.updated_at))}<div class="inspector-actions"><button class="secondary" data-action="toggle-context-consent">${s.codex_context_consent?'⊘ Revoke Codex local context':'✓ Authorize Codex local context'}</button><button class="secondary" data-action="rename-session">✎ Rename</button><button class="secondary" data-action="archive-session">${s.archived_at?'↥ Restore task':'⌑ Archive task'}</button><button class="danger-btn" data-action="delete-session">⌫ Permanently delete task</button></div>`}if(state.view==='knowledge'&&state.currentProject){const p=state.projectDetail||state.currentProject,linked=linkedSessions(p.id),stats=p.index_stats||{},idx=projectIndex(p);return `<h2>Knowledge properties</h2>${prop('Name',p.name)}${prop('ID',p.id,'mono')}${prop('Index status',idx.label)}${prop('RAG chunks',p.chunks||0)}${prop('Indexed files',stats.indexed_files??'—')}${prop('Supported / scanned files',`${stats.supported_files??'—'} / ${stats.scanned_files??'—'}`)}${prop('Truncated / failed',`${stats.truncated_files?.length||0} / ${stats.failed_files||0}`)}${prop('Unsupported files',stats.unsupported_files||0)}${prop('Linked tasks',linked.length)}${prop('Obsidian',p.vault_path,'mono')}${prop('External sources',p.source_paths?.length||0)}${p.managed!==undefined?prop('File management',p.managed?'Workflow-managed':'External sources + workflow overlay'):''}<div class="inspector-actions"><button class="secondary" data-action="reindex-project">↻ Rebuild index</button><button class="secondary" data-action="rename-project">✎ Rename</button><button class="secondary" data-action="archive-project">${p.archived?'↥ Restore knowledge':'⌑ Archive knowledge'}</button><button class="danger-btn" data-action="delete-project">⌫ Delete knowledge</button></div>`}if(state.view==='workspaces'&&state.currentWorkspace){const w=state.currentWorkspace;return `<h2>Workspace properties</h2>${prop('Name',w.name)}${prop('ID',w.id,'mono')}${prop('Directory',w.directory,'mono')}${prop('Permissions','Read-only · Commands disabled')}${prop('Capabilities',w.capabilities.join(' · '))}<div class="inspector-actions"><button class="secondary" data-action="inspect-workspace">⌕ Inspect file statistics</button></div><p class="muted small">Workspaces are managed through disk manifests. To prevent accidental data loss, the console does not delete workspace directories.</p>`}return `<h2>Workflow guide</h2>${prop('Flow','New task → Project analysis → Knowledge approval → Staged implementation → Acceptance and retention')}${prop('Local model','Handles understanding, retrieval, planning, writing, and stages it can complete')}${prop('Codex','Joins only when the project-level decision requires real tools or file operations')}<p class="muted small">Select a task, knowledge project, or workspace to view its properties and management actions here.</p>`}
function prop(n,v,c=''){return `<div class="property"><div class="property-name">${esc(n)}</div><div class="property-value ${c}">${esc(v)}</div></div>`}
function bindSearch(input,role){if(!input)return;input.oninput=e=>{state.query=e.target.value;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>{render();const next=document.querySelector(`[data-role="${role}"]`);if(next){next.focus();next.setSelectionRange(state.query.length,state.query.length)}},160)}}
async function loadMemories({rerender=true}={}){if(state.memoryQuery)return searchMemories();const result=await api(memoryListPath()),items=result.items;state.memoryHasMore=items.length>MEMORY_PAGE_SIZE;state.memories=items.slice(0,MEMORY_PAGE_SIZE);state.memoryResults=null;if(!state.memories.length&&state.memoryOffset){state.memoryOffset=Math.max(0,state.memoryOffset-MEMORY_PAGE_SIZE);return loadMemories({rerender})}if(rerender&&state.view==='memories')render();return true}
async function searchMemories(){const query=state.memoryQuery.trim(),sequence=++state.memorySearchSeq;if(!query){state.memoryResults=null;try{return await loadMemories()}catch(e){if(sequence===state.memorySearchSeq)toast(e.message,true);return false}}const params=new URLSearchParams({query,limit:String(MEMORY_PAGE_SIZE+1),offset:String(state.memoryOffset)});if(state.memoryProject==='global')params.set('scope','global');else{params.set('project_id',state.memoryProject);params.set('include_global','false')}if(state.memoryKind!=='all')params.append('kinds',state.memoryKind);try{const results=await api('/memories/search?'+params.toString());if(sequence!==state.memorySearchSeq)return false;state.memoryHasMore=results.length>MEMORY_PAGE_SIZE;state.memoryResults=results.slice(0,MEMORY_PAGE_SIZE).map(x=>({...x.memory,_score:x.score}));if(!state.memoryResults.length&&state.memoryOffset){state.memoryOffset=Math.max(0,state.memoryOffset-MEMORY_PAGE_SIZE);return searchMemories()}if(state.view==='memories'){render();const input=document.querySelector('[data-role="memory-search"]');if(input){input.focus();input.setSelectionRange(state.memoryQuery.length,state.memoryQuery.length)}}return true}catch(e){if(sequence===state.memorySearchSeq)toast(e.message,true);return false}}
async function changeMemoryPage(direction){if(direction>0&&!state.memoryHasMore||direction<0&&!state.memoryOffset)return;const previous=state.memoryOffset;state.memoryOffset=Math.max(0,state.memoryOffset+direction*MEMORY_PAGE_SIZE);busy('Loading long-term memory…');try{const ok=state.memoryQuery?await searchMemories():await loadMemories();if(!ok){state.memoryOffset=previous;if(state.view==='memories')render()}}catch(e){state.memoryOffset=previous;throw e}finally{idle()}}
function bindMemoryControls(){const input=document.querySelector('[data-role="memory-search"]'),project=document.querySelector('[data-role="memory-project"]'),kind=document.querySelector('[data-role="memory-kind"]');if(input)input.oninput=e=>{state.memoryQuery=e.target.value;state.memoryOffset=0;state.memoryHasMore=false;clearTimeout(window.memorySearchTimer);window.memorySearchTimer=setTimeout(searchMemories,220)};if(project)project.onchange=async e=>{state.memoryProject=e.target.value;state.memoryOffset=0;state.memoryHasMore=false;state.memoryResults=null;try{await loadMemories()}catch(x){toast(x.message,true)}};if(kind)kind.onchange=async e=>{state.memoryKind=e.target.value;state.memoryOffset=0;state.memoryHasMore=false;state.memoryResults=null;try{await loadMemories()}catch(x){toast(x.message,true)}}}
function bindDynamic(){const nf=$('new-session-form'),chat=$('chat-input'),suppress=$('chat-suppress-memory');if(nf)nf.onsubmit=createSession;if(chat)chat.oninput=()=>{state.chatPendingKey=null};if(suppress)suppress.onchange=e=>{state.chatSuppressMemory=e.target.checked;state.chatPendingKey=null};bindSearch(document.querySelector('[data-role="task-search"]'),'task-search');bindSearch(document.querySelector('[data-role="knowledge-search"]'),'knowledge-search');bindMemoryControls()}
function showModal(title,body,actions){const m=$('modal');m.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2></div><div class="modal-body">${body}</div><div class="modal-actions"><button class="ghost" data-action="close-modal">Cancel</button>${actions}</div>`;m.showModal()}
function memoryFormBody(memory=null){const scope=memory?.scope||(state.memoryProject==='global'?'global':'project'),projectId=memory?.project_id||(state.memoryProject==='global'?'':state.memoryProject),kind=memory?.kind||'fact';return `<div class="form-grid"><label>Scope<select id="memory-scope"><option value="global" ${scope==='global'?'selected':''}>Global</option><option value="project" ${scope==='project'?'selected':''}>Project</option></select></label><label>Project<select id="memory-project-id"><option value="">Select project</option>${state.projects.filter(x=>!x.archived||x.id===projectId).map(x=>`<option value="${esc(x.id)}" ${projectId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Type<select id="memory-kind">${Object.entries(memoryKindName).map(([value,label])=>`<option value="${value}" ${kind===value?'selected':''}>${label}</option>`).join('')}</select></label><label>Confidence<input id="memory-confidence" type="number" min="0" max="1" step="0.01" value="${memory?.confidence??1}"></label><label class="wide">Content<textarea id="memory-content" maxlength="20000" placeholder="Record information that can be reused across conversations">${esc(memory?.content||'')}</textarea></label><label>Source<input id="memory-source" maxlength="500" value="${esc(memory?.source||'user')}"></label><label>Source reference (optional)<input id="memory-source-ref" maxlength="2000" value="${esc(memory?.source_ref||'')}"></label></div>`}
function memoryPayload(){const scope=$('memory-scope').value,projectId=$('memory-project-id').value||null,content=$('memory-content').value.trim(),source=$('memory-source').value.trim(),confidence=Number($('memory-confidence').value);if(!content)throw new Error('Enter memory content');if(!source)throw new Error('Enter a source');if(scope==='project'&&!projectId)throw new Error('Project memory requires a project');if(!Number.isFinite(confidence)||confidence<0||confidence>1)throw new Error('Confidence must be between 0 and 1');return{scope,project_id:scope==='project'?projectId:null,kind:$('memory-kind').value,content,source,source_ref:$('memory-source-ref').value.trim()||null,confidence}}
function createMemory(){state.currentMemory=null;showModal('New long-term memory',memoryFormBody(),'<button class="primary" data-action="confirm-create-memory">Create</button>')}
function editMemory(id){const memory=state.memories.find(x=>x.id===id)||state.memoryResults?.find(x=>x.id===id);if(!memory)return toast('Memory not found. Refresh and try again.',true);state.currentMemory=memory;showModal('Edit long-term memory',memoryFormBody(memory),'<button class="primary" data-action="confirm-edit-memory">Save</button>')}
function deleteMemory(id){const memory=state.memories.find(x=>x.id===id)||state.memoryResults?.find(x=>x.id===id);if(!memory)return toast('Memory not found. Refresh and try again.',true);state.currentMemory=memory;showModal('Delete long-term memory',`<p>After deletion, this memory will no longer participate in context retrieval for any conversation. This action cannot be undone.</p><div class="status-banner">${esc(memory.content.slice(0,240))}</div><label>Enter DELETE to confirm<input id="confirm-value" autocomplete="off"></label>`,'<button class="danger-btn" data-action="confirm-delete-memory">Permanently delete</button>')}
async function createSession(e){e.preventDefault();const f=new FormData(e.target),project=f.get('project');busy('The local model is analyzing the entire project…');try{const s=await api('/agent/sessions',{method:'POST',body:JSON.stringify({title:f.get('title'),goal:f.get('goal'),project_id:project==='__auto__'?null:project,workspace_id:f.get('workspace')||null,create_project:project==='__auto__',codex_context_consent:f.has('codex_context_consent')})});state.currentSession=s;state.view='session';await refresh({quiet:true});toast('Project analysis complete')}catch(e){toast(e.message,true)}finally{idle()}}
async function openSession(id,quiet=false){if(!quiet)busy('Opening task…');try{const previousSessionId=state.currentSession?.id,session=await api(`/agent/sessions/${id}`);if(state.chatRun&&state.chatRun.session_id!==session.id)clearChatState();if(previousSessionId&&previousSessionId!==session.id)state.chatSuppressMemory=false;state.currentSession=session;state.view='session';render();resumeSessionChatRun(session)}catch(e){if(!quiet)toast(e.message,true)}finally{if(!quiet)idle()}}
async function openProject(id){state.currentProject=state.projects.find(x=>x.id===id);state.projectDetail=null;state.view='knowledge';render();try{state.projectDetail=await api(`/knowledge/projects/${id}`);render()}catch(e){toast(e.message,true)}}
async function action(name,el){if(name==='toggle-inspector'){$('inspector').classList.toggle('mobile-open');return}if(name==='nav'){state.view=el.dataset.view;state.query='';if(state.view!=='session')state.currentSession=null;render();return}if(name==='new-session'){state.view='new';state.query='';render();return}if(name==='refresh'){const ok=await refresh();if(ok)toast('Refreshed');return}if(name==='open-session'){await openSession(el.dataset.id);return}if(name==='open-project'){await openProject(el.dataset.id);return}if(name==='task-filter'){state.taskFilter=el.dataset.filter;render();return}if(name==='knowledge-filter'){state.knowledgeFilter=el.dataset.filter;render();return}if(name==='open-workspace'){state.currentWorkspace=state.workspaces.find(x=>x.id===el.dataset.id);state.view='workspaces';render();return}if(name==='close-modal'){$('modal').close();return}if(name==='approve-knowledge')return approveKnowledge();if(name==='advance-stage')return advanceStage();if(name==='send-chat')return sendChat();if(name==='cancel-chat')return cancelChat(el.dataset.id);if(name==='rename-session')return renameSession();if(name==='archive-session')return archiveSession();if(name==='delete-session')return deleteSession();if(name==='toggle-context-consent')return toggleContextConsent();if(name==='create-memory')return createMemory();if(name==='edit-memory')return editMemory(el.dataset.id);if(name==='delete-memory')return deleteMemory(el.dataset.id);if(name==='memory-prev')return changeMemoryPage(-1);if(name==='memory-next')return changeMemoryPage(1);if(name==='create-knowledge')return createKnowledge();if(name==='rename-project')return renameProject();if(name==='archive-project')return archiveProject();if(name==='delete-project')return deleteProject();if(name==='reindex-project')return reindexProject();if(name==='inspect-workspace')return inspectWorkspace()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!state.requestInFlight)action(el.dataset.action,el).catch(x=>{idle();toast(x.message,true)})});
async function approveKnowledge(){const ids=[...document.querySelectorAll('.source-check:checked')].map(x=>x.value);if(!ids.length)return toast('Select at least one source',true);busy('Researching, writing to Obsidian, and updating RAG…');try{state.currentSession=await api(`/agent/sessions/${state.currentSession.id}/knowledge/approve`,{method:'POST',body:JSON.stringify({selected_source_ids:ids})});await refresh({quiet:true});toast('Knowledge build complete')}finally{idle()}}
async function advanceStage(){busy('Running the current stage…');try{state.currentSession=await api(`/agent/sessions/${state.currentSession.id}/advance`,{method:'POST',body:JSON.stringify({instruction:$('stage-note')?.value||''})});await refresh({quiet:true});toast(state.currentSession.status==='codex_running'?'Handed off to the Codex worker':'Stage complete')}finally{idle()}}
function closeChatStream(){if(state.chatReconnectTimer){clearTimeout(state.chatReconnectTimer);state.chatReconnectTimer=null}if(state.chatStream){state.chatStream.close();state.chatStream=null}}
function clearChatState(){closeChatStream();state.chatRun=null;state.chatLastEventId=0;state.chatReplayFloor=0;state.chatSeenEvents=new Set();state.chatPartial='';state.chatCharacterCount=0;state.chatReconnectAttempt=0;state.chatConnectionLabel='';state.chatSuppressMemory=false;state.chatContextTelemetry=null}
function updateChatProgress(){const warning=$('chat-context-warning');if(warning&&state.currentSession)warning.innerHTML=chatContextWarningHtml(state.currentSession);const status=$('chat-run-status'),characters=$('chat-character-count'),partial=$('chat-partial');if(!status||!characters||!partial){if(state.view==='session')render();return}status.textContent=state.chatConnectionLabel||state.chatRun?.status||'Running';characters.textContent=`Received ${state.chatCharacterCount} characters`;partial.textContent=state.chatPartial||state.chatRun?.partial_text||state.chatRun?.final_text||'Waiting for model output…';partial.scrollTop=partial.scrollHeight}
async function settleChatRun(runId){const run=state.chatRun;if(!run||run.id!==runId)return;try{const latestRun=await api(`/agent/chat-runs/${runId}`);if(!state.chatRun||state.chatRun.id!==runId)return;state.chatRun=latestRun;const sessionId=latestRun.session_id;if(state.currentSession?.id===sessionId){state.currentSession=await api(`/agent/sessions/${sessionId}`);if(activeChatRunId(state.currentSession)!==runId){clearChatState()}render()}}catch(e){toast(e.message,true)}}
function handleChatRunEvent(event){let item;try{item=JSON.parse(event.data)}catch{return}if(!state.chatRun||item.run_id!==state.chatRun.id)return;const seq=Number(item.seq||event.lastEventId||0),key=`${item.run_id}:${seq}`;if(!seq||seq<=state.chatLastEventId||state.chatSeenEvents.has(key))return;const payload=item.payload||{},type=item.event_type||event.type,historical=seq<=state.chatReplayFloor;state.chatSeenEvents.add(key);state.chatLastEventId=seq;if(historical){if(type==='context_ready')state.chatContextTelemetry={current_message_truncated:!!payload.current_message_truncated,current_message_tokens:Number(payload.current_message_tokens||0)};else if(type==='run_requeued')state.chatContextTelemetry=null;updateChatProgress();return}let terminal=false;if(type==='run_created'){state.chatRun={...state.chatRun,status:'queued'};state.chatConnectionLabel='Waiting for background execution'}else if(type==='run_claimed'){state.chatRun={...state.chatRun,status:'running'};state.chatConnectionLabel='Local model streaming'}else if(type==='context_ready'){state.chatContextTelemetry={current_message_truncated:!!payload.current_message_truncated,current_message_tokens:Number(payload.current_message_tokens||0)}}else if(type==='run_requeued'){state.chatPartial='';state.chatCharacterCount=0;state.chatContextTelemetry=null;state.chatRun={...state.chatRun,status:'queued',partial_text:'',final_text:null};state.chatConnectionLabel='Execution was requeued; incomplete output from the previous attempt was cleared'}else if(type==='token'){const content=String(payload.content??payload.partial_text??'');if(content){state.chatPartial+=content;state.chatCharacterCount+=Array.from(content).length}state.chatRun={...state.chatRun,status:'running',partial_text:state.chatPartial};state.chatConnectionLabel='Local model streaming'}else if(type==='run_completed'){state.chatPartial=String(payload.final_text??state.chatPartial);state.chatCharacterCount=Array.from(state.chatPartial).length;state.chatRun={...state.chatRun,status:'completed',final_text:state.chatPartial,partial_text:state.chatPartial};state.chatConnectionLabel='Response complete';terminal=true}else if(type==='run_failed'){state.chatRun={...state.chatRun,status:'failed',error:payload.error||'Background response failed'};state.chatConnectionLabel='Response failed: '+(payload.error||'Unknown error');terminal=true}else if(type==='run_cancelled'){state.chatRun={...state.chatRun,status:'cancelled',error:payload.reason||'Cancelled by user'};state.chatConnectionLabel='Response cancelled';terminal=true}updateChatProgress();if(terminal){closeChatStream();setTimeout(()=>settleChatRun(item.run_id),150)}}
function connectChatEvents(runId){if(!state.chatRun||state.chatRun.id!==runId||!['queued','running'].includes(state.chatRun.status))return;closeChatStream();const url=`/api/v1/agent/chat-runs/${encodeURIComponent(runId)}/events?after_seq=${state.chatLastEventId}`;const stream=new EventSource(url);state.chatStream=stream;state.chatConnectionLabel=state.chatLastEventId?'Resuming from the event cursor…':'Connecting to the streaming response…';updateChatProgress();for(const type of ['run_created','run_claimed','context_ready','run_requeued','token','run_completed','run_failed','run_cancelled'])stream.addEventListener(type,handleChatRunEvent);stream.onopen=()=>{if(state.chatStream!==stream)return;state.chatReconnectAttempt=0;state.chatConnectionLabel=state.chatRun?.status==='running'?'Local model streaming':'Waiting for background execution';updateChatProgress()};stream.onerror=()=>{if(state.chatStream!==stream||!state.chatRun||!['queued','running'].includes(state.chatRun.status))return;state.chatReconnectAttempt+=1;state.chatConnectionLabel='Connection interrupted. Resuming automatically with Last-Event-ID…';updateChatProgress();if(stream.readyState===EventSource.CLOSED){state.chatStream=null;const delay=Math.min(8000,500*2**Math.min(state.chatReconnectAttempt,4));state.chatReconnectTimer=setTimeout(()=>connectChatEvents(runId),delay)}}}
async function attachChatRun(runId,sessionId){if(!runId)return;if(state.chatRun?.id===runId&&state.chatStream)return;closeChatStream();try{const run=await api(`/agent/chat-runs/${runId}`);if(run.session_id!==sessionId)throw new Error('The background response does not belong to the current task');const active=['queued','running'].includes(run.status);state.chatRun=run;state.chatReplayFloor=active?run.last_event_seq||0:0;state.chatLastEventId=active?0:run.last_event_seq||0;state.chatSeenEvents=new Set();state.chatPartial=run.partial_text||run.final_text||'';state.chatCharacterCount=Array.from(state.chatPartial).length;state.chatContextTelemetry=null;state.chatConnectionLabel=state.chatReplayFloor?'Restoring event context…':'';if(state.currentSession?.id===sessionId)render();if(active)connectChatEvents(run.id);else settleChatRun(run.id)}catch(e){toast('Could not restore the background response: '+e.message,true)}}
function resumeSessionChatRun(session){const runId=activeChatRunId(session);if(runId){attachChatRun(runId,session.id);return}if(state.chatRun?.session_id===session.id){clearChatState();if(state.view==='session')render()}}
async function sendChat(){const input=$('chat-input'),content=input.value.trim(),sessionId=state.currentSession?.id;if(!content||!sessionId)return;const suppressMemory=!!$('chat-suppress-memory')?.checked;state.chatSuppressMemory=suppressMemory;const key=state.chatPendingKey||(crypto.randomUUID?.()||`chat-${Date.now()}-${Math.random().toString(16).slice(2)}`);state.chatPendingKey=key;busy('Creating a resumable background response…');try{const run=await api(`/agent/sessions/${sessionId}/chat-runs`,{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify({content,suppress_memory:suppressMemory})});state.chatPendingKey=null;state.chatRun=run;state.chatLastEventId=run.last_event_seq||0;state.chatReplayFloor=0;state.chatSeenEvents=new Set();state.chatPartial=run.partial_text||'';state.chatCharacterCount=Array.from(state.chatPartial).length;state.chatContextTelemetry=null;state.chatConnectionLabel='Waiting for background execution';state.chatSuppressMemory=false;input.value='';render();connectChatEvents(run.id)}finally{idle()}}
async function cancelChat(runId){if(!runId)return;busy('Cancelling the background response…');try{state.chatRun=await api(`/agent/chat-runs/${runId}/cancel`,{method:'POST',body:JSON.stringify({reason:'cancelled by user from Local-First Agent Workbench'})});closeChatStream();state.chatConnectionLabel='Response cancelled';render();toast('Background response cancelled');setTimeout(()=>settleChatRun(runId),250)}finally{idle()}}
function renameSession(){const s=state.currentSession;showModal('Rename task',`<label>New name<input id="modal-name" value="${esc(s.title)}" maxlength="120"></label>`,`<button class="primary" data-action="confirm-rename-session">Save</button>`)}
async function archiveSession(){const s=state.currentSession;busy(s.archived_at?'Restoring task…':'Archiving task…');try{state.currentSession=await api(`/agent/sessions/${s.id}`,{method:'PATCH',body:JSON.stringify({archived:!s.archived_at})});await refresh({quiet:true});toast(s.archived_at?'Task restored':'Task archived')}finally{idle()}}
function deleteSession(){const s=state.currentSession;showModal('Permanently delete task',`<p>This deletes the project session, stages, and conversation timeline, but not the linked knowledge project. The task cannot be deleted while knowledge building, the local model, or Codex is running.</p><label>Enter the task name to confirm<input id="confirm-value" placeholder="${esc(s.title)}"></label>`,`<button class="danger-btn" data-action="confirm-delete-session">Permanently delete</button>`)}
function toggleContextConsent(){const enabled=!!state.currentSession.codex_context_consent;showModal(enabled?'Revoke Codex local context access':'Authorize Codex to read local context',enabled?'<p>After access is revoked, later Codex stages receive only the task goal and no longer receive local knowledge excerpts, prior-stage results, or read-only workspace paths.</p>':'<p>After authorization, the system may provide relevant local knowledge excerpts, prior-stage results, and read-only workspace paths only when this project actually enters a Codex stage. Nothing is published publicly, and no write access is granted outside the workspace.</p>',`<button class="${enabled?'danger-btn':'primary'}" data-action="confirm-context-consent">${enabled?'Confirm revocation':'Confirm authorization'}</button>`)}
function createKnowledge(){showModal('New knowledge project',`<label>Name<input id="knowledge-name" placeholder="For example: Nutrition literature"></label><label style="margin-top:12px">ID<input id="knowledge-id" placeholder="Generated automatically; editable"></label><p>This creates a project entry in Obsidian's AI Workbench directory and a separate RAG index.</p>`,`<button class="primary" data-action="confirm-create-knowledge">Create</button>`);$('knowledge-name').oninput=e=>{$('knowledge-id').value=slug(e.target.value)}}
function renameProject(){const p=state.currentProject;showModal('Rename knowledge project',`<label>New name<input id="modal-name" value="${esc(p.name)}" maxlength="120"></label>`,`<button class="primary" data-action="confirm-rename-project">Save</button>`)}
async function archiveProject(){const p=state.currentProject;busy(p.archived?'Restoring knowledge project…':'Archiving knowledge project…');try{state.currentProject=await api(`/knowledge/projects/${p.id}`,{method:'PATCH',body:JSON.stringify({archived:!p.archived})});state.projectDetail=state.currentProject;await refresh({quiet:true});toast(p.archived?'Knowledge project restored':'Knowledge project archived')}finally{idle()}}
function deleteProject(){const p=state.projectDetail||state.currentProject,linked=linkedSessions(p.id);showModal('Delete knowledge project',`<p>This removes the registration, vector index, and long-term memories and search terms belonging only to this project. Global memories and memories from other projects are unaffected. External source directories are never deleted.</p>${linked.length?`<div class="status-banner">${linked.length} tasks still reference this knowledge project.</div><label class="checkline"><input id="detach-sessions" type="checkbox"><span>Detach and archive those tasks while retaining their history</span></label>`:''}${p.managed?`<label class="checkline"><input id="trash-files" type="checkbox"><span>Also move the workflow-managed Obsidian directory to <code>.Trash</code> (recoverable)</span></label>`:''}<label>Enter the knowledge project name to confirm<input id="confirm-value" placeholder="${esc(p.name)}"></label>`,`<button class="danger-btn" data-action="confirm-delete-project">Delete knowledge</button>`)}
async function reindexProject(){busy('Rebuilding the RAG index…');try{await api(`/knowledge/projects/${state.currentProject.id}/index`,{method:'POST'});await refresh({quiet:true});state.projectDetail=await api(`/knowledge/projects/${state.currentProject.id}`);render();toast('Index rebuilt')}finally{idle()}}
async function inspectWorkspace(){busy('Inspecting workspace…');try{state.workspaceInspection=await api(`/workspaces/${state.currentWorkspace.id}/inspect`);render();toast('Workspace inspection complete')}finally{idle()}}
function slug(s){const a=s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);return a&&/^[a-z]/.test(a)?a:`project-${Date.now().toString(36)}`}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a?.startsWith('confirm-'))return;try{if(a==='confirm-rename-session'){const name=$('modal-name').value.trim();state.currentSession=await api(`/agent/sessions/${state.currentSession.id}`,{method:'PATCH',body:JSON.stringify({title:name})});$('modal').close();await refresh({quiet:true});toast('Task renamed')}if(a==='confirm-delete-session'){const s=state.currentSession,confirm=$('confirm-value').value;if(confirm!==s.title)return toast('Name does not match',true);await api(`/agent/sessions/${s.id}`,{method:'DELETE',body:JSON.stringify({confirm_title:confirm})});$('modal').close();state.currentSession=null;state.view='tasks';await refresh({quiet:true});toast('Task deleted')}if(a==='confirm-context-consent'){const next=!state.currentSession.codex_context_consent;state.currentSession=await api(`/agent/sessions/${state.currentSession.id}`,{method:'PATCH',body:JSON.stringify({codex_context_consent:next})});$('modal').close();render();toast(next?'Codex local context authorized for this project':'Codex local context access revoked')}if(a==='confirm-create-memory'){busy('Saving long-term memory…');state.currentMemory=await api('/memories',{method:'POST',body:JSON.stringify(memoryPayload())});$('modal').close();await loadMemories({rerender:false});render();toast('Long-term memory created')}if(a==='confirm-edit-memory'){const memory=state.currentMemory;busy('Updating long-term memory…');state.currentMemory=await api(`/memories/${memory.id}?expected_revision=${memory.revision}`,{method:'PATCH',body:JSON.stringify(memoryPayload())});$('modal').close();await loadMemories({rerender:false});render();toast('Long-term memory updated')}if(a==='confirm-delete-memory'){if($('confirm-value').value.trim()!=='DELETE')return toast('Enter DELETE to confirm',true);const memory=state.currentMemory;busy('Deleting long-term memory…');await api(`/memories/${memory.id}?expected_revision=${memory.revision}`,{method:'DELETE'});$('modal').close();state.currentMemory=null;await loadMemories({rerender:false});render();toast('Long-term memory deleted')}if(a==='confirm-create-knowledge'){const name=$('knowledge-name').value.trim(),id=$('knowledge-id').value.trim();if(!name||!id)return toast('Enter a name and ID',true);busy('Creating and indexing the knowledge project…');await api('/knowledge/projects',{method:'POST',body:JSON.stringify({name,id,source_paths:[]})});$('modal').close();await refresh({quiet:true});toast('Knowledge project created')}if(a==='confirm-rename-project'){const name=$('modal-name').value.trim();state.currentProject=await api(`/knowledge/projects/${state.currentProject.id}`,{method:'PATCH',body:JSON.stringify({name})});state.projectDetail=state.currentProject;$('modal').close();await refresh({quiet:true});toast('Knowledge project renamed')}if(a==='confirm-delete-project'){const p=state.projectDetail||state.currentProject,confirm=$('confirm-value').value;if(confirm!==p.name)return toast('Name does not match',true);busy('Safely deleting the knowledge project…');await api(`/knowledge/projects/${p.id}`,{method:'DELETE',body:JSON.stringify({confirm_name:confirm,trash_managed_files:!!$('trash-files')?.checked,detach_sessions:!!$('detach-sessions')?.checked})});$('modal').close();state.currentProject=null;state.projectDetail=null;if(state.memoryProject===p.id){state.memoryProject='global';state.memoryOffset=0;state.memoryHasMore=false;state.memoryResults=null}await refresh({quiet:true});toast('Knowledge project deleted')}}catch(x){toast(x.message,true)}finally{idle()}});
refresh();setInterval(async()=>{if(state.requestInFlight||state.refreshing)return;const current=state.currentSession,wasEditing=editing();await refresh({quiet:true,preserveEditor:true});if(!current||wasEditing||editing()||state.view!=='session')return;const summary=state.sessions.find(x=>x.id===current.id);if(!summary){state.currentSession=null;render();return}if(summary.updated_at!==current.updated_at)await openSession(current.id,true)},10000);
</script>
