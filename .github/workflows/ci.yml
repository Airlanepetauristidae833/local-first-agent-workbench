name: release-validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_ENV: ${{ runner.temp }}/local-first-agent.env
      RELEASE_STATE: ${{ runner.temp }}/local-first-agent-state
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap isolated configuration
        run: >-
          bash scripts/bootstrap.sh
          --env-file "$RELEASE_ENV"
          --state-root "$RELEASE_STATE"

      - name: Validate Compose configuration
        run: docker compose --env-file "$RELEASE_ENV" config --quiet

      - name: Validate Python, JavaScript, and shell syntax
        run: |
          python3 scripts/validate_sources.py
          bash -n scripts/*.sh
          pwsh -NoLogo -NoProfile -Command '& {
            $failures = @()
            Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              )
              $failures += $errors
            }
            if ($failures.Count) { $failures | Out-String | Write-Error; exit 1 }
          }'

      - name: Run API tests
        run: >-
          docker compose --env-file "$RELEASE_ENV" --profile test
          run --build --rm api-tests

      - name: Run Ruff
        run: >-
          docker compose --env-file "$RELEASE_ENV" --profile test
          run --rm api-tests ruff check --target-version py312
          --select E4,E7,E9,F,I app tests

      - name: Run knowledge tests
        run: >-
          docker compose --env-file "$RELEASE_ENV" --profile test
          run --build --rm knowledge-tests

      - name: Scan manifest, tree, and staged index
        run: python3 scripts/privacy_scan.py --require-git

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove CI containers and volumes
        if: always()
        run: >-
          docker compose --env-file "$RELEASE_ENV" --profile test
          down --volumes --remove-orphans
