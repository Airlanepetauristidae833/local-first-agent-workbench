version: 2
updates:
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps(python)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps(actions)

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      api-container-images:
        patterns:
          - "*"
    commit-message:
      prefix: deps(container)

  - package-ecosystem: docker
    directory: /services/knowledge
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      knowledge-container-images:
        patterns:
          - "*"
    commit-message:
      prefix: deps(container)
