name: Bug report
description: Report a reproducible defect in the documented project boundary
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Search existing issues first. Do not include secrets, personal knowledge, private hostnames or addresses, database files, authentication material, or unredacted logs. Report security findings privately through the [security policy](https://github.com/Joviei/local-first-agent-workbench/blob/main/SECURITY.md).

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Workbench UI or FastAPI
        - Durable Agent runs or streaming
        - Memory or context management
        - Knowledge indexing or RAG
        - Web research or SearXNG
        - Open WebUI bridge
        - Ollama or local-model integration
        - Optional Codex handoff worker
        - Bootstrap, status, validation, or CI
        - Docker, networking, or private remote access
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what user-visible impact did it have?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest numbered sequence that reproduces the problem from a documented configuration.
      placeholder: |
        1. Start the stack with ...
        2. Open ...
        3. Submit ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error text or event state when useful.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Do not include machine names, private addresses, Tailnet names, usernames, or absolute personal paths.
      placeholder: |
        - Host OS and version:
        - Docker Engine/Desktop and Compose versions:
        - Repository commit or release:
        - Ollama version and model:
        - Browser (if relevant):
        - Access path: loopback / private overlay
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only the minimum relevant output. Replace sensitive values with placeholders such as <TOKEN>, <PRIVATE_HOST>, and <LOCAL_PATH>.
      render: text

  - type: textarea
    id: regression
    attributes:
      label: Regression information
      description: If this worked before, identify the last known working release or commit and what changed.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-report confirmation
      options:
        - label: I searched existing issues and read the relevant documentation.
          required: true
        - label: I removed credentials, personal data, private network details, and local absolute paths.
          required: true
        - label: This is not a vulnerability or other sensitive security report.
          required: true
