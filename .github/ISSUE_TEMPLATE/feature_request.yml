name: Feature request
description: Propose an outcome that fits the local-first project direction
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are evaluated by user evidence, maintainability, privacy, and alignment with the single-user, single-node reference scope. Please describe the problem before prescribing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, what are they trying to do, and what evidence shows the need?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and how success could be validated.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation or interface proposal. Keep authority and trust boundaries explicit.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and why they are insufficient.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Workbench interaction
        - Durable execution
        - Memory or context
        - Knowledge or RAG
        - Web research
        - Model/provider integration
        - Optional Codex handoff
        - Operations or recovery
        - Security or privacy
        - Contributor experience
        - Other
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, security, and compatibility effects
      description: Identify data collection, network exposure, tool authority, persisted-state, migration, or backward-compatibility effects. Write "None identified" only after considering each category.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and reviewed the roadmap.
          required: true
        - label: I have not included private data, credentials, or sensitive security details.
          required: true
        - label: I understand that this request is not a delivery commitment.
          required: true
